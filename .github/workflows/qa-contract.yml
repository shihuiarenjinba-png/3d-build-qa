name: Windows QA evidence contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q qa_gate.py msix_artifact_verify.py msix_zip_guard.py tests
      - run: python -m unittest discover -s tests -v
