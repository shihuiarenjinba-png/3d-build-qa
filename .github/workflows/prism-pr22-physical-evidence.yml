name: Prism PR25 physical evidence contract (QA only)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  FACTORY_ARTIFACT_ID: '13642354096'
  QA_ARTIFACT_ID: '13672673982'
  FACTORY_SOURCE_SHA: '4c22875c5ed79d393516c6a7a95361b9e9ed1950'
jobs:
  physical-contract-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact PR25 provenance and six-session contract
        run: |
          python -m unittest discover -s tests -p 'test_prism_first30s_physical_windows_gate.py' -v
          python -m unittest discover -s tests -p 'test_prism_pr25_physical_handoff.py' -v
          python - <<'PY'
          import os
          from prism_consumer_artifact_runtime_gate import SOURCE, ARTIFACT_ID, MEMBERS
          from prism_pr25_physical_handoff import capture_template, verify_template
          assert SOURCE == os.environ['FACTORY_SOURCE_SHA']
          assert ARTIFACT_ID == int(os.environ['FACTORY_ARTIFACT_ID'])
          assert MEMBERS['candidate.pck'][1] == '189c020a545e269ac639f9982e41c45dbc180a069ed9b51000927951448b19c9'
          assert int(os.environ['QA_ARTIFACT_ID']) == 13672673982
          template = capture_template()
          verify_template(template)
          assert len(template['sessions']) == 6
          assert len({p for s in template['sessions'] for p in s['screenshots'].values()}) == 36
          assert not template['physical_device']
          print('PASS: PR25 lineage and empty 6-session/36-image template; PHYSICAL_HOLD')
          PY
      - name: Upload empty PR25 physical capture template (never a PASS receipt)
        run: |
          mkdir -p "$RUNNER_TEMP/pr25-physical"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from prism_pr25_physical_handoff import capture_template
          p=Path(os.environ['RUNNER_TEMP'])/'pr25-physical/physical-capture.EMPTY.json'
          p.write_text(json.dumps(capture_template(),indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prism-pr25-six-session-empty-template-physical-hold
          path: ${{ runner.temp }}/pr25-physical/
          if-no-files-found: error
          retention-days: 7
  physical-contract-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PR25 negative fixtures on Windows CI (not physical operator QA)
        run: python -m unittest discover -s tests -p 'test_prism_first30s_physical_windows_gate.py' -v
      - name: Empty capture remains HOLD
        shell: pwsh
        run: |
          python -c "from prism_pr25_physical_handoff import capture_template,verify_template; x=capture_template();verify_template(x);assert len(x['sessions'])==6 and not x['physical_device'];print('PHYSICAL_HOLD')"
          if ($LASTEXITCODE -ne 0) { throw 'PR25 physical contract failed' }
